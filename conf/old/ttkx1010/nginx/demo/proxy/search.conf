server {
    listen 80;

        resolver 8.8.8.8 1.1.1.1 168.95.1.1 valid=60s;
        resolver_timeout 3s;

        # 依專案調整
        server_name  search01.579666.net search02.579666.net;

        access_log /var/log/nginx/search_access.log main;
        error_log /var/log/nginx/search_error.log;

        location / {
                # 依專案調整
                # 前端_查詢_search-ng
                proxy_pass http://a296bf038335c45038c6af2784df2804-29b694cb79849199.elb.ap-northeast-1.amazonaws.com;
                proxy_buffer_size 8192k;
                proxy_buffers 4 8192k;
                proxy_redirect off;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

                proxy_ignore_client_abort on;
                proxy_connect_timeout 60;
                proxy_read_timeout 60;
                proxy_send_timeout 60;
                proxy_set_header proto-status $scheme;
                #proxy_set_header Host $host;

                include       mime.types;
                default_type  application/octet-stream;
        }

        location /api/ {
                #後端_導航_springboot-searchplatform
                proxy_pass http://ab36c0d29f50a485b9fa1c9575cc6d50-86df9e0ff47ccef7.elb.ap-northeast-1.amazonaws.com:8089/;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header REMOTE-HOST $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

                proxy_ignore_client_abort on;
                proxy_connect_timeout 60;
                proxy_read_timeout 60;
                proxy_send_timeout 60;
                proxy_set_header proto-status $scheme;
        }

}
