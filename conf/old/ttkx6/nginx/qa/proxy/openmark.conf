server {
    listen 80;

        resolver 1.1.1.1 168.95.1.1 valid=60s;
        resolver_timeout 3s;

        # 依專案調整
        #server_name  marksix-qa-openmark.good-start-168.com;
        server_name  marksix-qa-openserve.good-start-168.com;

        access_log /var/log/nginx/openmark_access.log main;
        error_log /var/log/nginx/openmark_error.log;

        location / {               
                # 依專案調整
                # 前端_openmark_openmark-ng
                proxy_pass http://a349e7599e45244eeadffee6f1df1133-4c38c338d0163db6.elb.ap-northeast-1.amazonaws.com;

                add_header Access-Control-Allow-Origin *;

                client_max_body_size 200M;
                proxy_buffer_size 8192k;
                proxy_buffers 4 8192k;
                proxy_redirect off;
                proxy_busy_buffers_size 16384k;
                proxy_temp_file_write_size 16384k;
                proxy_hide_header  Vary;
                proxy_ignore_headers Cache-Control Expires;

                proxy_ssl_server_name on;
                proxy_connect_timeout 60;
                proxy_read_timeout 60;
                proxy_send_timeout 60;

                proxy_http_version 1.1;

                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header Connection "";
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Host $host;
                proxy_set_header X-Forwarded-Server $host;
                proxy_set_header proto-status $scheme;
                proxy_set_header Cookie $http_cookie;
                proxy_pass_header Set-Cookie;
                proxy_set_header   Accept-Encoding '';
                proxy_set_header   Referer $http_referer;
                #proxy_set_header Host $host;

                proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 non_idempotent;
                proxy_ignore_headers Set-Cookie;

                include       mime.types;
                default_type  application/octet-stream;
        }

        location /api/ {
                #後端_開獎_springboot-selfopen
                proxy_pass http://a180c325d07664c6ea57d40b770d8b1e-206a49cbf7fd1a3a.elb.ap-northeast-1.amazonaws.com:8098/;

                client_max_body_size 200M;
                proxy_buffer_size 8192k;
                proxy_buffers 4 8192k;
                proxy_redirect off;
                proxy_busy_buffers_size 16384k;
                proxy_temp_file_write_size 16384k;
                proxy_hide_header  Vary;
                proxy_ignore_headers Cache-Control Expires;

                proxy_ssl_server_name on;
                proxy_connect_timeout 60;
                proxy_read_timeout 60;
                proxy_send_timeout 60;

                proxy_http_version 1.1;

                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header Connection "";
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Host $host;
                proxy_set_header X-Forwarded-Server $host;
                proxy_set_header proto-status $scheme;
                proxy_set_header Cookie $http_cookie;
                proxy_pass_header Set-Cookie;
                proxy_set_header   Accept-Encoding '';
                proxy_set_header   Referer $http_referer;

                proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 non_idempotent;
                proxy_ignore_headers Set-Cookie;
        }
}
