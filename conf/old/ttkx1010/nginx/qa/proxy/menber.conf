server {
    listen 80;

        resolver 8.8.8.8 1.1.1.1 168.95.1.1 valid=60s;
        resolver_timeout 3s;

        # 依專案調整
        server_name  everycolor-menber.good-start-168.com;

        access_log /var/log/nginx/menber_access.log main;
        error_log /var/log/nginx/menber_error.log;

        location / {                                
                # 依專案調整
                # 前端_會員_menber-ng
                proxy_pass http://afdb9019c2acd45e1adc5dbceb83fe98-a594a4464784e655.elb.ap-northeast-1.amazonaws.com;
                proxy_buffer_size 8192k;
                proxy_buffers 4 8192k;
                proxy_redirect off;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

                proxy_ignore_client_abort on;
                proxy_connect_timeout 60;
                proxy_read_timeout 60;
                proxy_send_timeout 60;
                proxy_set_header proto-status $scheme;
                #proxy_set_header Host $host;

                include       mime.types;
                default_type  application/octet-stream;
        }

        location /api/ {
                #後端_會員_springboot-portal
                proxy_pass http://a47436b42918e41158426ee1ee4083ae-110f660f43759d46.elb.ap-northeast-1.amazonaws.com:8082/;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header REMOTE-HOST $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

                proxy_ignore_client_abort on;
                proxy_connect_timeout 60;
                proxy_read_timeout 60;
                proxy_send_timeout 60;
                proxy_set_header proto-status $scheme;
        }

}
