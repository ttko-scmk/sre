server {
    listen 80;

        resolver 8.8.8.8 1.1.1.1 168.95.1.1 valid=60s;
        resolver_timeout 3s;

        # 依專案調整
        server_name  everycolor-agent.good-start-168.com;        

        access_log /var/log/nginx/agent_access.log main;
        error_log /var/log/nginx/agent_error.log;

        location / {                               
                # 依專案調整
                # 前端_代理_agent-ng
                proxy_pass http://a2998f037ec0a4cc9b3af450bc21a216-3a294eac76aaada2.elb.ap-northeast-1.amazonaws.com;
                proxy_buffer_size 8192k;
                proxy_buffers 4 8192k;
                proxy_redirect off;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

                proxy_ignore_client_abort on;
                proxy_connect_timeout 60;
                proxy_read_timeout 60;
                proxy_send_timeout 60;
                proxy_set_header proto-status $scheme;
                #proxy_set_header Host $host;

                include       mime.types;
                default_type  application/octet-stream;
        }

        location /api/ {
                # 後端_代理_springboot-agent
                proxy_pass http://ad9c7a9e1b9b54ce2aa0822087827e9d-ca62c1a126cfc0e7.elb.ap-northeast-1.amazonaws.com:8081/;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header REMOTE-HOST $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

                proxy_ignore_client_abort on;
                proxy_connect_timeout 60;
                proxy_read_timeout 60;
                proxy_send_timeout 60;
                proxy_set_header proto-status $scheme;
        }

}
