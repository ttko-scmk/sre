upstream menber1 {
  zone menber1_zone 64k;
  resolver 8.8.8.8 1.1.1.1 valid=30s ipv6=off;
  resolver_timeout 10s;
  server internal-k8s-default-portal10-bf9dbc2050-1364545415.ap-southeast-1.elb.amazonaws.com:80 resolve;
}
server {
    listen 80;
    server_name  1mp.ythj.net 2mp.hvhj.net 3mp.qwzd.net 4mp.kijes.net 5mp.nbmh.net;
    server_name  1mp.fqac.net 2mp.qwfs.net 3mp.yhj1.net 4mp.jm6y.net 5mp.tht5.net;

    index index.html;
    access_log /var/log/nginx/web_access.log main buffer=192k flush=30s;
    error_log /var/log/nginx/web_error.log;

    ## Mobile Detection
    if ($http_user_agent ~* "(android|bb\d+|meego).+mobile|avantgo|bada\/|blackberry|blazer|compal|elaine|fennec|hiptop|iemobile|ip(hone|od)|iris|kindle|lge |maemo|midp|mmp|mobile.+firefox|netfront|opera m(ob|in)i|palm( os)?|phone|p(ixi|re)\/|plucker|pocket|psp|series(4|6)0|symbian|treo|up\.(browser|link)|vodafone|wap|windows ce|xda|xiino") {
        set $mobile_request 'ok';
    }


    ## Root Location
    location / {

        add_header Device 'PC';
        root /data/menber/;

        #APP、H5
        if ($mobile_request = 'ok') {
            add_header Device 'Mobile';
            root  /data/mphone/;
        }

        if (!-e $request_filename) {
            rewrite ^(.*)$ /index.html?s=$1 last;
            break;
        }

        try_files $uri /$uri /index.html;
    }
    location /api/ {
        #後端_會員_springboot-portal
        #proxy_pass http://internal-k8s-default-portal10-bf9dbc2050-1364545415.ap-southeast-1.elb.amazonaws.com/;
		proxy_pass http://menber1/;
        client_max_body_size 200M;
		proxy_connect_timeout 60s;
		proxy_send_timeout 60s;
		proxy_read_timeout 60s;
    }
}  ## END...
