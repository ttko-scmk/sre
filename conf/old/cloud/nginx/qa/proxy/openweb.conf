server {
    listen 80;

        resolver 8.8.8.8 1.1.1.1 168.95.1.1 valid=60s;
        resolver_timeout 3s;

        # 依專案調整
        server_name     everycolor-openweb.good-start-168.com;



        access_log /var/log/nginx/opendoor_access.log main;
        error_log /var/log/nginx/opendoor_error.log;

        location / {
                # 依專案調整
                # 前端_資訊網_openweb-apache
                proxy_pass http://a66444680450745e0937fca4e614b1b3-b95ba14cd143bf5f.elb.ap-northeast-1.amazonaws.com;
                proxy_buffer_size 8192k;
                proxy_buffers 4 8192k;
                proxy_redirect off;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

                proxy_ignore_client_abort on;
                proxy_connect_timeout 60;
                proxy_read_timeout 60;
                proxy_send_timeout 60;
                proxy_set_header proto-status $scheme;
                #proxy_set_header Host $host;

                include       mime.types;
                default_type  application/octet-stream;
        }

}
