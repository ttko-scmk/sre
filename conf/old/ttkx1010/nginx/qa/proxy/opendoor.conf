server {
    listen 80;

        resolver 8.8.8.8 1.1.1.1 168.95.1.1 valid=300s;
        resolver_timeout 3s;

        # 依專案調整
        server_name  everycolor-opendoor.good-start-168.com;

        access_log /var/log/nginx/opendoor_access.log main;
        error_log /var/log/nginx/opendoor_error.log;

        location / {
                # 依專案調整
                # 前端_開獎中心_opendoor-ng
                proxy_pass http://ab8c25751c90242b4b694c9f83979c54-c0b082667f61dbc3.elb.ap-northeast-1.amazonaws.com;
                proxy_buffer_size 8192k;
                proxy_buffers 4 8192k;
                proxy_redirect off;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

                proxy_ignore_client_abort on;
                proxy_connect_timeout 60;
                proxy_read_timeout 60;
                proxy_send_timeout 60;
                proxy_set_header proto-status $scheme;
                #proxy_set_header Host $host;

                include       mime.types;
                default_type  application/octet-stream;
        }
        location /api/ {
                #後端_springboot-selfopencontrol
                proxy_pass https://a43ce89668cb2434284af6f7045dd13c-3b82b52ea468fe64.elb.ap-northeast-1.amazonaws.com:8099/;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header REMOTE-HOST $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_ssl_server_name on;

                proxy_ignore_client_abort on;
                proxy_connect_timeout 60;
                proxy_read_timeout 60;
                proxy_send_timeout 60;
                proxy_set_header proto-status $scheme;
        }
}
