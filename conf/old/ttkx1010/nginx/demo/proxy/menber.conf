server {
    listen 80;

        resolver 8.8.8.8 1.1.1.1 168.95.1.1 valid=60s;
        resolver_timeout 3s;

        # 依專案調整
        server_name  87963m.new76color.com  89367m.new99erery.com;

        # 備用
        server_name  67953m.mwpx99v.com 68953m.zein88v.com;


        access_log /var/log/nginx/menber_access.log main;
        error_log /var/log/nginx/menber_error.log;

        location / {                                
                # 依專案調整
                # 前端_會員_menber-ng
                proxy_pass http://a395f3b396c4f473b9f93e8f22627fd6-fe06880fe03c5213.elb.ap-northeast-1.amazonaws.com;
                proxy_buffer_size 8192k;
                proxy_buffers 4 8192k;
                proxy_redirect off;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

                proxy_ignore_client_abort on;
                proxy_connect_timeout 60;
                proxy_read_timeout 60;
                proxy_send_timeout 60;
                proxy_set_header proto-status $scheme;
                #proxy_set_header Host $host;

                include       mime.types;
                default_type  application/octet-stream;
        }

        location /api/ {
                #後端_會員_springboot-portal
                proxy_pass http://a9c83856bf0ea43bc9e12f9f0365fa0f-f3ccd976c11742fc.elb.ap-northeast-1.amazonaws.com:8082/;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header REMOTE-HOST $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

                proxy_ignore_client_abort on;
                proxy_connect_timeout 60;
                proxy_read_timeout 60;
                proxy_send_timeout 60;
                proxy_set_header proto-status $scheme;
        }

}
