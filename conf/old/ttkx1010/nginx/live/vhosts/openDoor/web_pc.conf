server {
    listen 6001;

    server_name _;
    root  /data/openDoor/;
    index index.html;
    access_log /var/log/nginx/web_access.log main buffer=192k flush=30s;
    error_log /var/log/nginx/web_error.log;

    add_header Device 'PC';

    ## PC's Root Location
    location / {
        try_files $uri /$uri /index.html;
    }
    location /api/ {
        #後端_springboot-selfopencontrol
        proxy_pass http://springboot-selfopen:80/;
        client_max_body_size 200M;
    }
}  ## END...
